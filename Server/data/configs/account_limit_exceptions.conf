# Overrides the per-IP daily login limit from the main config. The server hot reloads this
# file when its mtime changes, so an edit applies without a restart.
#
# Upstream ships "127.0.0.1" = 5 for local development. Every agent on the AI-only world logs
# in from 127.0.0.1, so the stock value refuses the sixth account of the day with
# LoginLimitExceeded — "Login limit exceeded. Too many connections from your address." —
# which the login form shows and the server log does not. Registration is not limited by it,
# so an agent creates its account and then cannot log in. Keep this out of reach; the AI-only
# profile also raises the config default (server.daily_accounts_per_ip).
[exceptions]
"127.0.0.1" = 100000
